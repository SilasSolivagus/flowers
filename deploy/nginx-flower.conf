# edge-nginx 上的 flower.dirctable.com —— **切换前后只差两行**。
#
# 现状（2026-11-10 读取 /etc/nginx/conf.d/80-flower.conf）：
#   上游写的是 `flower:3000`，指向 edge_net 上的 Flower 容器 flower-flower-1。
#
# 切换 = 把两处 `set $flower_upstream "flower:3000";` 改成宿主机的
# `172.19.0.1:3010`（edge_net 的网关，宿主机在这个地址上可见），reload edge-nginx。
# 回滚 = 改回 `flower:3000`，reload。nginx 一个字节都不用动。
#
# 为什么是网关 IP 而不是 host.docker.internal：Linux 上后者需要 --add-host，
# 而 172.19.0.1 是 edge_net 自己的网关，稳定且不用改容器参数。
# 核对网关：docker network inspect edge_net --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
#
# 完整文件见服务器 /etc/nginx/conf.d/80-flower.conf；下面是**改完之后**的形状。

server {
    listen 80;
    server_name flower.dirctable.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 登录口限流：10r/m + burst 5，超限 429。沿用 Flower 时期那一条。
limit_req_zone $binary_remote_addr zone=flower_login_gate:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name flower.dirctable.com;

    ssl_certificate /etc/letsencrypt/live/flower.dirctable.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flower.dirctable.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # 交回材料的表单上限是 6MB（next.config.ts 的 serverActions.bodySizeLimit），
    # 这里给 50M 是老配置一贯的余量，不必收。
    client_max_body_size 50M;

    # 登录：同一个限流桶。flowers 的登录是 server action（POST 到页面路径而不是
    # /api/v1/auth/login），所以这一条**不再是精确匹配**，改用前缀匹配兜住这个动作。
    location = /login {
        limit_req zone=flower_login_gate burst=5 nodelay;
        set $flower_upstream "172.19.0.1:3010";
        proxy_pass http://$flower_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $flower_upstream "172.19.0.1:3010";
        proxy_pass http://$flower_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
